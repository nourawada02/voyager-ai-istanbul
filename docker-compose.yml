# VoyagerAI Istanbul -- root Docker Compose (Checkpoint Phase 4 D.2B,
# docs/adr/0016-phase4-checkpoint-d2b-frontend-and-compose.md).
#
# Exactly five long-running services, matching architecture.md §4.1's
# fixed container map one-to-one -- no MongoDB, PostgreSQL, Redis,
# Celery, Kafka, Kubernetes, auth, payment, or booking service is ever
# added here:
#
#   chatbot-ui (Streamlit) -> agent-system-a (LangGraph, FastAPI/SSE)
#     agent-system-a -> mcp-server (Travel MCP, Streamable HTTP)
#     agent-system-a -> agent-system-b (Google ADK, A2A)
#       agent-system-b -> vector-db (Qdrant)
#
# Every cross-service call uses the internal Compose service name
# (e.g. `http://agent-system-a:8002`) -- never `localhost`, which would
# resolve to the calling container itself, not the target service.
#
# Two supported modes, both zero-paid-provider-call by default:
#   1. Deterministic offline fixture mode (default): VOYAGER_SYSTEM_A_MODE
#      defaults to "fixture" below, so `docker compose up` with no `.env`
#      file at all makes zero paid-provider calls. agent-system-b's own
#      RAG_REQUIRED=false lets it degrade cleanly to catalog-only
#      scheduling even before vector-db has ever been populated (see the
#      Qdrant population note below) -- every one of the five containers
#      still starts and passes its own health check either way. Manual QA
#      remediation Q.1 (second correction pass, §2) note: agent-system-b
#      now defaults QDRANT_URL to the real vector-db service (below), so
#      even this "offline" mode makes one real, free, no-key network call
#      on first boot to download its pinned embedding model -- not a
#      paid-provider call, but not fully air-gapped either. Set
#      QDRANT_URL= (empty) explicitly in a real .env to restore a fully
#      offline first boot.
#   2. Real-provider mode: set VOYAGER_SYSTEM_A_MODE=real and supply
#      QWEN_API_KEY/QWEN_BASE_URL/SERPAPI_API_KEY through the environment
#      (a real .env file, never committed -- see .env.example). No
#      literal credential ever appears in this file.
#
# Qdrant population (Manual QA remediation Q.1, §A -- supersedes the
# original Checkpoint D.2B design note this replaced): vector-db still
# starts as an empty, real Qdrant instance -- ingestion is deliberately
# NOT baked into vector-db's own startup, and is NOT a sixth
# long-running service. Instead, `rag-ingest` (defined below,
# `profiles: ["ingest"]`) is a real, committed, idempotent one-shot CLI
# service that never starts with a bare `docker compose up` and is run
# explicitly:
#
#   docker compose run --rm rag-ingest bootstrap
#
# This ingests the full existing approved Istanbul corpus
# (rag/documents/*.json) if the collection is missing or empty, and is a
# safe no-op if it is already correctly populated -- reproducible from a
# fresh clone / empty volume, not a manual, undocumented, host-only step.
# agent-system-b degrades safely (RAG_REQUIRED=false) with an explicit,
# distinguishable warning if this step was never run, exactly as
# Checkpoint B already proved. See rag/ingest_cli.py and rag/Dockerfile
# for the full command surface (status/bootstrap/ingest --source, the
# last one for adding reviewed demo documents at runtime).

services:
  vector-db:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_storage:/qdrant/storage
    # Published to the host deliberately: the documented one-time,
    # out-of-band Phase 3 ingestion workflow (see the Qdrant population
    # note above) runs from the host against http://localhost:6333 --
    # container-to-container calls (agent-system-b -> vector-db) use the
    # internal Compose service name regardless of this mapping.
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: services/travel-mcp/Dockerfile
    environment:
      PORT: "8001"
    # No host port published: mcp-server is called only by agent-system-a
    # over the internal Compose network (TRAVEL_MCP_BASE_URL=
    # http://mcp-server:8001) -- no documented host-side workflow needs
    # to reach it directly, so it is not exposed beyond the Compose
    # network (revalidated during this checkpoint's D.2B correction pass).
    expose:
      - "8001"
    restart: unless-stopped
    # No dependency on vector-db: MCP owns dynamic shared travel tools,
    # never Qdrant retrieval (docs/adr/0001-phase1-contracts.md).

  agent-system-b:
    build:
      context: ./services/istanbul-expert-b
    environment:
      PORT: "8000"
      ADVERTISED_HOST: agent-system-b
      # Manual QA remediation Q.1 (second correction pass, §2): a real,
      # non-secret, committed default -- the internal Compose service
      # name, never `localhost` or a secret. This is the reproducibility
      # fix: a fresh clone/empty `.env` must resolve System B to the real
      # `vector-db` service by construction, not depend on a
      # git-ignored, host-local `.env` edit that a QA report cannot hand
      # off to another machine. `${QDRANT_URL:-...}` still lets an
      # operator override it (e.g. to point at an external Qdrant, or to
      # blank it out for a genuinely offline fixture run) -- the syntax
      # itself is unchanged, only the fallback value moved from empty to
      # this real default.
      #
      # Tradeoff, disclosed rather than hidden: this means the FIRST
      # `docker compose up` (any mode, including offline fixture mode)
      # now also pays System B's real embedding-model cold start
      # (multi-minute on an unprimed rag_ingest_model_cache/
      # agent_system_b_data volume, observed directly in this
      # checkpoint's own gate) instead of skipping it. Set
      # QDRANT_URL= (empty) explicitly in a real .env to restore the old
      # always-skip-RAG-warmup behavior for a genuinely offline run.
      QDRANT_URL: "${QDRANT_URL:-http://vector-db:6333}"
      # RAG-FIRST SYSTEM B R.1: local demo environment default points at
      # the R.1 shadow collection (rag/corpus_sources.py's expanded
      # corpus), not the frozen Phase 3 production collection --
      # explicit, not implicit, and reversible by editing these two
      # lines back (never a collection rename/copy/delete; both
      # collections continue to coexist in vector-db unchanged). The
      # fingerprint is read from the shadow collection's own stored
      # `__fingerprint__` marker point, not guessed -- it is identical to
      # `istanbul_rag_B`'s fingerprint because both were built under the
      # same frozen chunk-config/embedding identity (Checkpoint Phase 4
      # §5/§9's frozen contract); only the corpus content differs.
      QDRANT_COLLECTION_NAME: "istanbul_rag_B_r1_shadow"
      QDRANT_EXPECTED_FINGERPRINT: "34830f8e42e681ce7fdedc5a36fbd33675ae4800505a06768bc783d6057d7b84"
      # Explicitly false for the offline fixture smoke (checkpoint
      # instruction) -- System B degrades cleanly to catalog-only
      # scheduling with an explicit warning rather than requiring a
      # populated vector-db before it can even start.
      RAG_REQUIRED: "false"
    # No host port published: agent-system-b is called only by
    # agent-system-a over the internal Compose network
    # (ISTANBUL_EXPERT_A2A_BASE_URL=http://agent-system-b:8000) -- no
    # documented host-side workflow needs to reach it directly
    # (revalidated during this checkpoint's D.2B correction pass).
    expose:
      - "8000"
    volumes:
      - agent_system_b_data:/data
    depends_on:
      vector-db:
        condition: service_healthy
    restart: unless-stopped

  agent-system-a:
    build:
      context: .
      dockerfile: orchestration/system_a/Dockerfile
    environment:
      PORT: "8002"
      # Explicit, default-safe: "fixture" unless the caller sets
      # VOYAGER_SYSTEM_A_MODE=real in a real .env file. Never silently
      # switches direction on its own (orchestration/system_a/config.py).
      VOYAGER_SYSTEM_A_MODE: "${VOYAGER_SYSTEM_A_MODE:-fixture}"
      VOYAGER_SYSTEM_A_DB_PATH: /data/system_a.db
      TRAVEL_MCP_BASE_URL: "http://mcp-server:8001"
      ISTANBUL_EXPERT_A2A_BASE_URL: "http://agent-system-b:8000"
      # Placeholders only -- required in "real" mode, unused and safe to
      # leave empty in "fixture" mode. Never a literal credential; always
      # supplied through the environment (a real, never-committed .env).
      QWEN_API_KEY: "${QWEN_API_KEY:-}"
      QWEN_BASE_URL: "${QWEN_BASE_URL:-}"
      QWEN_MODEL: "${QWEN_MODEL:-}"
      SERPAPI_API_KEY: "${SERPAPI_API_KEY:-}"
    # Published to the host deliberately: agent-system-a is the system's
    # one genuine public API/SSE surface (architecture.md's own "public
    # System A service" design, Checkpoint D.2A) -- chatbot-ui itself
    # still reaches it over the internal Compose network
    # (AGENT_SYSTEM_A_BASE_URL=http://agent-system-a:8002), this mapping
    # exists for direct host-side API access/testing.
    ports:
      - "8002:8002"
    volumes:
      - agent_system_a_data:/data
    depends_on:
      mcp-server:
        condition: service_healthy
      agent-system-b:
        condition: service_healthy
    restart: unless-stopped

  chatbot-ui:
    build:
      context: ./services/frontend
    environment:
      PORT: "8501"
      AGENT_SYSTEM_A_BASE_URL: "http://agent-system-a:8002"
    ports:
      - "8501:8501"
    depends_on:
      agent-system-a:
        condition: service_healthy
    restart: unless-stopped

  # Manual QA remediation Q.1 (§A): the real, committed, one-command RAG
  # ingestion/bootstrap CLI (rag/ingest_cli.py) as a Compose one-shot
  # service -- `profiles: ["ingest"]` means it NEVER starts as part of a
  # bare `docker compose up` (the documented "exactly five long-running
  # services" topology above is unchanged) and is only ever run
  # explicitly:
  #
  #   docker compose run --rm rag-ingest bootstrap
  #   docker compose run --rm rag-ingest status
  #   docker compose run --rm -v ./my-demo-docs:/demo-documents:ro \
  #     rag-ingest ingest --source /demo-documents
  #
  # QDRANT_URL below sets rag/ingest_cli.py's own --qdrant-url default,
  # so every invocation above already targets the real vector-db service
  # with no extra flag needed. Idempotent and safe to run against an
  # already-populated collection (a no-op, reported honestly) -- this is
  # what makes "a fresh clone/empty-volume setup is reproducible" true:
  # `vector-db` alone starts empty, and `rag-ingest bootstrap` is the one
  # command that brings it to a real, query-ready state before
  # agent-system-b is expected to serve citation-bearing results.
  rag-ingest:
    profiles: ["ingest"]
    build:
      context: ./rag
    environment:
      QDRANT_URL: "http://vector-db:6333"
    volumes:
      - rag_ingest_model_cache:/data/model_cache
    depends_on:
      vector-db:
        condition: service_healthy
    command: ["bootstrap"]

volumes:
  # Checkpoint Phase 4 D.2A/D.2B: run/session/event history plus the
  # LangGraph checkpoint tables (orchestration/system_a/run_store.py,
  # config.py::db_path) -- survives `docker compose restart
  # agent-system-a` and `docker compose down` (without `-v`).
  agent_system_a_data:
  # Qdrant's own on-disk index storage -- survives a restart; explicitly
  # NOT pre-populated by this file (see the Qdrant population note above).
  qdrant_storage:
  # agent-system-b's ADK session store + optional embedding-model cache
  # (services/istanbul-expert-b/Dockerfile's own /data ENV vars) --
  # avoids re-downloading the pinned embedding model on every restart.
  agent_system_b_data:
  # Manual QA remediation Q.1 (§A): the rag-ingest one-shot service's own
  # embedding-model cache, separate from agent_system_b_data (a
  # different container, a different image) -- avoids re-downloading the
  # pinned model on every `docker compose run rag-ingest ...` invocation.
  rag_ingest_model_cache:
