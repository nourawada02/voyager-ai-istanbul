services:
  vector-db:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 6

  mcp-server:
    build:
      context: ./services/travel-mcp
    environment:
      PORT: "8001"
    ports:
      - "8001:8001"
    # No dependency on vector-db: MCP owns dynamic shared travel
    # capabilities, never Qdrant retrieval (docs/adr/0001-phase1-contracts.md).

  agent-system-b:
    build:
      context: ./services/istanbul-expert-b
    environment:
      PORT: "8000"
      ADVERTISED_HOST: agent-system-b
    ports:
      - "8000:8000"
    depends_on:
      vector-db:
        condition: service_healthy
      mcp-server:
        condition: service_healthy

  agent-system-a:
    build:
      context: ./services/planner-a
    environment:
      PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      mcp-server:
        condition: service_healthy
      agent-system-b:
        condition: service_healthy

  chatbot-ui:
    build:
      context: ./services/frontend
    environment:
      PORT: "8501"
    ports:
      - "8501:8501"
    depends_on:
      agent-system-a:
        condition: service_healthy
